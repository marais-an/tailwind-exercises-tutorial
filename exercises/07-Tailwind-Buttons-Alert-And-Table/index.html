<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <script src="https://cdn.tailwindcss.com"></script>
        <title>07 Tailwind Buttons, Alert and Table</title>
    </head>
    <body>
        <div class="w-full">
            <div class="flex">
                <div class="w-1/2 p-4">
                    <h5 class="text-xl font-semibold mb-2">
                        It's hard to remember all the bootstrap elements
                    </h5>
                    <p class="mb-4">
                        The rest seems easy because it was very well thought!
                        Don't you agree?
                    </p>
                    <button type="button" class="bg-green-600 text-white px-4 py-2 rounded">
                        Yes
                    </button>
                    <button type="button" class="bg-red-600 text-white px-4 py-2 rounded">
                        No
                    </button>
                </div>

                <div class="w-1/2 p-4">
                    <div role="alert" class="bg-yellow-100 text-yellow-800 border border-yellow-200 rounded p-4 mb-4">
                        If you don't agree some of this people may slap you in the face:
                    </div>

                    <table class="w-full border-collapse text-left">
                        <thead>
                            <tr class="border-b border-gray-800">
                                <th class="p-2">First</th>
                                <th class="p-2">Last</th>
                                <th class="p-2">Handle</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="bg-gray-100 border-b border-gray-200">
                                <td class="p-2">Mark</td>
                                <td class="p-2">Otto</td>
                                <td class="p-2">@mdo</td>
                            </tr>
                            <tr class="border-b border-gray-200">
                                <td class="p-2">Jacob</td>
                                <td class="p-2">Thornton</td>
                                <td class="p-2">@fat</td>
                            </tr>
                            <tr class="bg-gray-100 border-b border-gray-200">
                                <td class="p-2">Larry</td>
                                <td class="p-2">the Bird</td>
                                <td class="p-2">@twitter</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>
</html>
