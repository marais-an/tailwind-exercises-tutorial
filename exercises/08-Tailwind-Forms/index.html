<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<script src="https://cdn.tailwindcss.com"></script>
		<title>08 Tailwind Forms</title>
	</head>
	<body>
		<div class="w-full max-w-lg mx-auto my-5 px-4">
			<form class="bg-gray-600 rounded p-12">
				<h2 class="text-3xl font-semibold mb-2">Please login</h2>

				<input
					type="email"
					name="email"
					placeholder="Email Address"
					aria-label="Email Address"
					autocomplete="email"
					class="block w-full bg-white border border-gray-300 rounded px-3 py-2 mb-4"
				/>

				<input
					type="password"
					name="password"
					placeholder="Password"
					aria-label="Password"
					autocomplete="current-password"
					class="block w-full bg-white border border-gray-300 rounded px-3 py-2 mb-4"
				/>

				<label class="flex items-center gap-2 mb-4">
					<input type="checkbox" name="remember" />
					<span>Remember me</span>
				</label>

				<button
					type="submit"
					class="bg-blue-600 text-white w-full py-2 rounded"
				>Login</button>
			</form>
		</div>
	</body>
</html>
